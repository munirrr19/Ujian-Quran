<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ujian Syafawi Al-Quran</title>
<style>
:root{color-scheme:light;--bg:#faf6ea;--card:#fffdf5;--ink:#12303a;--mut:#5f7a80;--pri:#0a7a5c;--blue:#1d5f8f;--line:#e6dfc9;--bad:#b3261e;--ok:#0a7a5c;--soft:#f1ecd9}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,var(--blue),var(--pri));color:#fff;padding:16px}
header h1{margin:0;font-size:18px}header p{margin:2px 0 0;font-size:13px;opacity:.85}
nav{display:flex;gap:6px;padding:10px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:linear-gradient(120deg,var(--blue),var(--pri));color:#fff;border-color:transparent}
main{padding:0 16px 40px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.tot{display:flex;justify-content:space-between;gap:8px;text-align:center;margin-top:12px}
.tot div{flex:1;background:var(--soft);border-radius:8px;padding:8px}.tot b{display:block;font-size:20px;color:var(--blue)}
.tot span{font-size:11px;color:var(--mut)}
.row{display:flex;gap:8px;margin-top:12px}
button.p{background:linear-gradient(120deg,var(--blue),var(--pri));color:#fff;border:0;border-radius:8px;padding:11px 14px;font:inherit;cursor:pointer;flex:1}
button.s{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font:inherit;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--blue);background:var(--soft)}
.ptitle{display:none}
td.n,th.n{text-align:right}tr.click{cursor:pointer}.dot{color:var(--ok)}.none{color:var(--mut)}
.wrap{overflow-x:auto}.hide{display:none}.msg{color:var(--ok);font-size:13px;min-height:18px;margin-top:6px}
@media(max-width:600px){.hm{display:none}table{font-size:12px}th,td{padding:6px 4px}th{font-size:11px}.card.wrap{padding:8px}}
@page{size:A4 landscape;margin:12mm}
@media print{
  body{background:#fff;font-size:12px}
  header,nav,.row,#v1,#v3{display:none!important}
  #v2{display:block!important}
  main{padding:0;max-width:none}
  .card{border:0;padding:0}
  .wrap{overflow:visible}
  .ptitle{display:block;text-align:center;margin-bottom:10px}
  .ptitle h2{margin:0;font-size:16px;color:var(--blue)}.ptitle p{margin:2px 0 0;font-size:12px;color:var(--mut)}
  th,td{padding:5px 6px;border:1px solid #cfc8b0}
  th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{break-inside:avoid}
}
</style>
</head>
<body>
<header><h1>Ujian Syafawi Al-Quran</h1><p>Halaqah Ustaz Munir (2B 2026)</p></header>
<nav><button id="t1" class="on">Syafawi 40%</button><button id="t3">Bertulis 60%</button><button id="t2">Keputusan</button></nav>
<main>
<section id="v1">
  <div class="card"><label>Pilih pelajar</label><select id="sel"></select></div>
  <div class="card">
    <div class="grid" id="inputs"></div>
    <div class="tot">
      <div><b id="sH">0</b><span>Hafazan /80</span></div>
      <div><b id="sT">0</b><span>Jumlah /100</span></div>
      <div><b id="sP">0</b><span>Markah 40%</span></div>
    </div>
    <div style="margin-top:12px"><label>Catatan</label><input id="cat" placeholder="Catatan (pilihan)"></div>
    <div class="row"><button class="s" id="prev">‹</button><button class="p" id="save">Simpan</button><button class="s" id="next">›</button></div>
    <div class="msg" id="msg"></div>
  </div>
</section>
<section id="v3" class="hide">
  <div class="card"><label>Pilih pelajar</label><select id="selW"></select></div>
  <div class="card">
    <label>Markah mentah bertulis /100</label>
    <input id="wIn" type="number" inputmode="decimal" step="0.5" min="0" max="100" placeholder="0 – 100">
    <div class="tot"><div><b id="w60">0</b><span>Markah 60%</span></div><div><b id="wJum">0</b><span>Jumlah (40% + 60%)</span></div></div>
    <div class="row"><button class="s" id="prevW">‹</button><button class="p" id="saveW">Simpan</button><button class="s" id="nextW">›</button></div>
    <div class="msg" id="msgW"></div>
  </div>
</section>
<section id="v2" class="hide">
  <div class="ptitle"><h2>Keputusan Peperiksaan Al-Quran</h2><p>Halaqah Ustaz Munir (2B 2026) · <span id="pdate"></span></p></div>
  <div class="card wrap"><table id="tbl"></table></div>
  <div class="row"><button class="p" id="print">Cetak</button><button class="s" id="csv">Muat turun CSV</button><button class="s" id="reset">Padam semua</button></div>
</section>
</main>
<script>
// Tampal URL Web App Apps Script di sini (lihat README). Kosong = guna data contoh + simpanan pelayar sahaja.
const API='https://script.google.com/macros/s/AKfycbySdB1J0iinHm3uUGj9Qq-aIXc_JjaL9PsW6vpPrsT5WZ43kaC2LBvWObw98ASZXrobrA/exec';
// Senarai pelajar & markah awal (sandaran) diambil dari Google Sheet "ISI MARKAH"
let S=[
["E3225","MUHAMMAD AQEEQ EL HUMAM BIN MAZLAN",[9,9,8,8,7,7,8,8],10,3],
["E3425","MUHAMMAD FATEH IMRAN BIN MOHD NAZIM",[10,10,10,10,10,10,10,9],15,5],
["E3625","MUHAMMAD HAFIY FAYYAD BIN MOHD NOOR",[9,9,9,10,4,5,5,5],10,4],
["E3825","MUHAMMAD ILMI AIMAN BIN RAMLI",[8,9,10,9,10,8,9,9],13,4],
["E4025","MUHAMMAD IRSYAD HASNAN BIN MOHD ZAKI",[8.5,10,10,10,8,8,9,9],14,4],
["E4225","MUHAMMAD MIRZA ISYRAF BIN ISHAK",[10,9.5,9,9,10,9.5,8,9.5],13,4],
["E4425","MUHAMMAD MUJAHID BIN MOHD YATIMI",[10,9,10,9.5,10,8.5,9,9.5],14,4],
["E4625","MUHAMMAD ROSYIDI AL FAQIH BIN AHMAD SABRI",[10,10,10,10,10,9.5,9.5,9],13,4],
["E4825","MUHAMMAD UZAIR IRSYAD BIN MOHD YUSRI",[10,10,9.5,10,10,9.5,10,9.5],14,4],
["E5025","NIK MUHAMMAD ABID ALFAWWAZ BIN NIK FARHAN",[8,10,10,9,9,9,8,9],13,4],
["E5225","TUAN AMMAR HILMAN BIN TUAN SOH",[10,10,10,10,10,10,10,9.5],15,5],
["E5425","MUHAMMAD HAFIY AMJAD BIN SHAMSUDIN",[10,9,8,7.5,6,8,9.5,9],15,5],
["E5625","NIK IRHAM HADIF BIN NIK AHMAD HUZAIMI",[7,8,8,9,5,4,4,5],10,3],
["E5825","MUHAMMAD MUAZ BIN MOHD SOLLEH",[10,10,10,10,9.5,9,10,9],14,4],
["E6025","MUHAMMAD AMIN DARWISY BIN MOHD FAIZANI",[10,10,10,9,9,9,10,8],13,4],
["E6425","AHMAD UWAIS AL-QARNI BIN MOHD RAHMATUL FITHRI",[10,9,9,9,8,8,8,9.5],13,4]
];
const HL=["Awal Surah 1","Awal Surah 2","Awal Juz 1","Awal Juz 2","Awal Maqra' 1","Awal Maqra' 2","Awal Muka","Tebuk"];
const FIELDS=[...HL.map((h,i)=>({k:'h'+i,l:'Hafazan '+(i+1)+' – '+h,max:10})),{k:'tj',l:'Tajwid',max:15},{k:'fs',l:'Fasahah',max:5}];
const KEY='ujian-quran-2b-2026';
let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!data){data={};S.forEach(s=>{const r={};s[2].forEach((v,i)=>r['h'+i]=v);r.tj=s[3];r.fs=s[4];r.cat='';data[s[0]]=r})}
const $=id=>document.getElementById(id);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const num=v=>v===''||v==null||isNaN(v)?0:+v;
const r1=x=>Math.round(x*10)/10;
const r2=x=>Math.round(x*100)/100;
let W={};try{W=JSON.parse(localStorage.getItem(KEY+'-w'))||{}}catch(e){}
const w60=v=>r2(num(v)*0.6);
function calc(r){const h=r1([0,1,2,3,4,5,6,7].reduce((a,i)=>a+num(r['h'+i]),0));const t=r1(h+num(r.tj)+num(r.fs));return{h,t,p:r1(t*.4)}}
let cur=0;
const buildSel=()=>{const o=S.map((s,i)=>`<option value="${i}">${i+1}. ${s[1]}</option>`).join('');$('sel').innerHTML=o;$('selW').innerHTML=o};
buildSel();
$('inputs').innerHTML=FIELDS.map(f=>`<div><label>${f.l} /${f.max}</label><input type="number" inputmode="decimal" step="0.5" min="0" max="${f.max}" data-k="${f.k}" data-max="${f.max}"></div>`).join('');
const ins=[...document.querySelectorAll('#inputs input')];
function load(){const r=data[S[cur][0]];$('sel').value=cur;ins.forEach(i=>i.value=r[i.dataset.k]??'');$('cat').value=r.cat||'';tot();$('msg').textContent=''}
function tot(){const r={};ins.forEach(i=>r[i.dataset.k]=i.value);const c=calc(r);$('sH').textContent=c.h;$('sT').textContent=c.t;$('sP').textContent=c.p}
ins.forEach(i=>i.addEventListener('input',()=>{if(num(i.value)>+i.dataset.max)i.value=i.dataset.max;if(num(i.value)<0)i.value=0;tot()}));
async function save(){
  const r={cat:$('cat').value};ins.forEach(i=>r[i.dataset.k]=i.value===''?'':+i.value);
  const no=S[cur][0];data[no]=r;persist();render();
  if(!API){$('msg').textContent='✓ Disimpan (pelayar sahaja)';return}
  $('msg').textContent='Menyimpan ke Google Sheet…';
  try{
    const body={pass:PASS,no,h:[0,1,2,3,4,5,6,7].map(i=>r['h'+i]),tj:r.tj,fs:r.fs,cat:r.cat};
    const res=await(await fetch(API,{method:'POST',body:JSON.stringify(body)})).json();
    if(res.error)throw new Error(res.error);
    $('msg').textContent='✓ Disimpan ke Google Sheet';
  }catch(e){$('msg').textContent='✗ Gagal simpan ke Sheet: '+e.message}
}
$('sel').onchange=e=>{cur=+e.target.value;load()};
$('save').onclick=save;
$('prev').onclick=()=>{save();cur=(cur+S.length-1)%S.length;load()};
$('next').onclick=()=>{save();cur=(cur+1)%S.length;load()};
// ---- Bertulis 60% ----
let curW=0;
function loadW(){const no=S[curW][0];$('selW').value=curW;$('wIn').value=W[no]??'';showW();$('msgW').textContent=''}
function showW(){const no=S[curW][0],v=$('wIn').value,x=w60(v);$('w60').textContent=x;$('wJum').textContent=r2(calc(data[no]).p+x)}
$('wIn').addEventListener('input',()=>{const i=$('wIn');if(num(i.value)>100)i.value=100;if(num(i.value)<0)i.value=0;showW()});
async function saveW(){
  const no=S[curW][0],v=$('wIn').value===''?'':+$('wIn').value;
  W[no]=v;try{localStorage.setItem(KEY+'-w',JSON.stringify(W))}catch(e){}render();
  if(!API){$('msgW').textContent='✓ Disimpan (pelayar sahaja)';return}
  $('msgW').textContent='Menyimpan ke Google Sheet…';
  try{
    const res=await(await fetch(API,{method:'POST',body:JSON.stringify({pass:PASS,action:'written',no,w:v})})).json();
    if(res.error)throw new Error(res.error);
    $('msgW').textContent='✓ Disimpan ke Google Sheet';
  }catch(e){$('msgW').textContent='✗ Gagal simpan ke Sheet: '+e.message}
}
$('selW').onchange=e=>{curW=+e.target.value;loadW()};
$('saveW').onclick=saveW;
$('prevW').onclick=()=>{saveW();curW=(curW+S.length-1)%S.length;loadW()};
$('nextW').onclick=()=>{saveW();curW=(curW+1)%S.length;loadW()};
// ---- Keputusan ----
function rows(){return S.map((s,i)=>{const c=calc(data[s[0]]),b=w60(W[s[0]]),j=r2(c.p+b);return{i,no:s[0],nama:s[1],...c,w:W[s[0]]??'',b,j,a:Math.round(j)}})}
function render(){
  const rs=rows(),rank=x=>1+rs.filter(y=>y.j>x.j).length;
  $('tbl').innerHTML='<tr><th class="hm">Bil</th><th class="hm">No Diri</th><th>Nama</th><th class="n">Syafawi 40%</th><th class="n">Bertulis 60%</th><th class="n">Jumlah</th><th class="n">Akhir</th><th class="n">Ked.</th></tr>'+
  rs.map(x=>`<tr class="click" data-i="${x.i}"><td class="hm">${x.i+1}</td><td class="hm">${x.no}</td><td>${x.nama}</td><td class="n">${x.p}</td><td class="n">${x.b}</td><td class="n">${x.j}</td><td class="n"><b>${x.a}</b></td><td class="n">${rank(x)}</td></tr>`).join('');
}
$('tbl').onclick=e=>{const tr=e.target.closest('tr[data-i]');if(tr){cur=+tr.dataset.i;show(1);load()}};
function show(n){[1,2,3].forEach(i=>{$('v'+i).classList.toggle('hide',i!==n);$('t'+i).classList.toggle('on',i===n)})}
$('print').onclick=()=>{$('pdate').textContent=new Date().toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'});render();window.print()};
$('t1').onclick=()=>show(1);$('t2').onclick=()=>{render();show(2)};$('t3').onclick=()=>{curW=cur;loadW();show(3)};
$('csv').onclick=()=>{
  const head=['Bil','No Diri','Nama',...FIELDS.map(f=>f.l),'Jumlah Hafazan /80','Jumlah /100','Markah 40%','Bertulis /100','Bertulis 60%','Jumlah','Markah Akhir','Catatan'];
  const lines=[head,...S.map((s,i)=>{const r=data[s[0]],c=calc(r),x=rows()[i];return[i+1,s[0],s[1],...FIELDS.map(f=>r[f.k]),c.h,c.t,c.p,x.w,x.b,x.j,x.a,r.cat||'']})];
  const csv='﻿'+lines.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='keputusan-syafawi.csv';a.click();
};
$('reset').onclick=async()=>{
  if(!API){if(confirm('Padam semua markah dan kembali ke data asal?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}return}
  if(!confirm('Kosongkan SEMUA markah (hafazan, tajwid, fasahah, catatan, bertulis) di laman DAN di Google Sheet? Tidak boleh dikembalikan.'))return;
  try{
    const res=await(await fetch(API,{method:'POST',body:JSON.stringify({pass:PASS,action:'clear'})})).json();
    if(res.error)throw new Error(res.error);
    try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'-w')}catch(e){}
    location.reload();
  }catch(e){alert('Gagal kosongkan Sheet: '+e.message)}
};
$('reset').textContent=API?'Kosongkan semua markah':'Padam semua';
let PASS='';
async function boot(){
  if(API){
    try{PASS=localStorage.getItem(KEY+'-pass')||''}catch(e){}
    for(;;){
      if(!PASS){PASS=prompt('Masukkan kod akses:')||'';if(!PASS)break}
      try{
        const res=await(await fetch(API+'?pass='+encodeURIComponent(PASS))).json();
        if(res.error){PASS='';alert(res.error);try{localStorage.removeItem(KEY+'-pass')}catch(e){}continue}
        S=res.students.map(x=>[x.no,x.nama,x.h,x.tj,x.fs]);
        data={};W={};res.students.forEach(x=>{const r={cat:x.cat};x.h.forEach((v,i)=>r['h'+i]=v);r.tj=x.tj;r.fs=x.fs;data[x.no]=r;W[x.no]=x.w??''});
        try{localStorage.setItem(KEY+'-pass',PASS)}catch(e){}
        buildSel();break;
      }catch(e){alert('Tidak dapat sambung ke Google Sheet: '+e.message);break}
    }
  }
  load();loadW();render();
}
boot();
</script>
</body>
</html>
